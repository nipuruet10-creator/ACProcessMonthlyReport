          <h1 class="text-base sm:text-lg font-black text-slate-900 tracking-tight">AC Process Development</h1>
          <div class="text-[11px] text-slate-500 font-medium">Process Development Monthly Report</div>
        </div>

        <!-- Right Quick Actions -->
        <div class="flex items-center gap-2.5 sm:gap-3 flex-shrink-0">
          <!-- Live Status Badge -->
          <div id="navbar-cloud-sync-badge">
            <span class="inline-flex items-center gap-1.5 px-3 py-1 rounded-full text-xs font-semibold bg-emerald-50 text-emerald-700 border border-emerald-200 shadow-xs">

              <span>Real-Time Live</span>
            </span>
          </div>

          <!-- Sync Data Button -->
          <button onclick="App.triggerGlobalSync()" title="Synchronize latest tasks from Cloud & compile slides" class="px-3 py-1.5 rounded-xl bg-white hover:bg-slate-50 text-slate-700 border border-slate-200 text-xs font-semibold transition flex items-center gap-1.5 shadow-xs">
            <span class="text-blue-500">🔄</span>
            <span class="hidden md:inline">Sync Data</span>
          </button>

          <!-- User Role Badge -->
          <div id="user-role-badge"></div>

          <!-- Generate Monthly Report Fast Action -->
          <button onclick="ReportBuilderView.generateMonthlyReport()" class="inline-flex items-center gap-2 px-3.5 py-2 rounded-xl bg-[#DC2626] hover:bg-red-700 text-xs font-bold text-white shadow-sm transition">
            <span>📄</span>
            <span>Generate Report</span>
          </button>
        </div>
      </div>
    </header>

    <!-- MAIN VIEWPORT CONTAINER (Full Width for Maximum Table Area) -->
    <main class="flex-1 w-full max-w-[1920px] mx-auto px-3 sm:px-6 py-4">
      
      <!-- View 1: Dashboard (Default Landing Page) -->
      <div id="dashboard-view-container" class="view-container"></div>

      <!-- View 2: Monthly Input (Single Source of Truth) -->
